<app-profile>
  <mat-tab-group
    style="padding: 0px 14px 0px 14px; border-radius: 0px 0px 15px 15px"
  >
    <mat-tab label="Dashboard">
      <app-dashboard>
        <app-order-status-totals
          [data]="orderStatusTotals$ | async"
          [onload]="orderStatusTotalsOnLoad"
        ></app-order-status-totals>
      </app-dashboard>
    </mat-tab>
    <mat-tab label="Orders">
      <mat-tab-group
        mat-align-tabs="start"
        animationDuration="0ms"
        (selectedTabChange)="onTabChange($event)"
      >
        <mat-tab label="To Pay">
          <ng-container *ngIf="selectedTab == 'to_pay'">
            <app-order-list [type]="selectedTab"></app-order-list>
          </ng-container>
        </mat-tab>
        <mat-tab label="For Review">
          <ng-container *ngIf="selectedTab == 'for_review'">
            <app-order-list [type]="selectedTab"></app-order-list>
          </ng-container>
        </mat-tab>
        <mat-tab label="To Pack">
          <ng-container *ngIf="selectedTab == 'to_pack'">
            <app-order-list [type]="selectedTab"></app-order-list>
          </ng-container>
        </mat-tab>
        <mat-tab label="Ready For Pick-up">
          <ng-container *ngIf="selectedTab == 'for_pickup'">
            <app-order-list [type]="selectedTab"></app-order-list>
          </ng-container>
        </mat-tab>
        <mat-tab label="To Receive">
          <ng-container *ngIf="selectedTab == 'to_receive'">
            <app-order-list [type]="selectedTab"></app-order-list>
          </ng-container>
        </mat-tab>
        <mat-tab label="Canceled">
          <ng-container *ngIf="selectedTab == 'cancelled'">
            <app-order-list [type]="selectedTab"></app-order-list>
          </ng-container>
        </mat-tab>
      </mat-tab-group>
    </mat-tab>
    <mat-tab label="Saved Blogs">
      <div style="margin-top: 7px"></div>
      <app-blog-list
        [horizontalBlogListView]="true"
        [isShop]="false"
        [savedBlogsOnly]="true"
      ></app-blog-list>
    </mat-tab>
  </mat-tab-group>
</app-profile>
