<app-sticky-header
  [routerOutletComponent]="routerOutletComponent"
  (onSearch)="search($event)"
></app-sticky-header>

<div *ngIf="routerOutletComponent == 'ProductListPageComponent'">
  <div *ngIf="!isMapLoading; else loading">
    <app-map
      class="buyer-component"
      [shops]="this.shops"
      [subject]="subject"
    ></app-map>
  </div>
  <ng-template #loading>
    <div
      class="loader"
      style="width: 100vw; height: 200px; margin-top: 70px"
    ></div>
  </ng-template>
</div>

<section class="content">
  <router-outlet (activate)="fromRouterOutlet($event)"></router-outlet>
</section>

<app-sticky-footer
  *ngIf="routerOutletComponent == 'ProductListPageComponent'"
></app-sticky-footer>
