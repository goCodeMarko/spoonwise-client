<app-sticky-header
  [routerOutletComponent]="routerOutletComponent"
  (onSearch)="search($event)"
></app-sticky-header>

<div>
  <div *ngIf="routerOutletComponent == 'ProductListPageComponent'">
    <div *ngIf="!isMapLoading; else loading">
      <app-map
        *ngIf="!isShopViewing"
        class="buyer-component"
        [shops]="this.shops"
        [detectCurrentLocation]="true"
        [checkDBLocation]="true"
        [disabled]="false"
        [radius]="3000"
        (dragend)="onMapDragend($event)"
      ></app-map>
    </div>
    <ng-template #loading>
      <div
        class="loader"
        style="
          padding: 88px 7px 3px 7px;
          height: 100vh;
          z-index: 0;
          border-radius: 10px;
        "
      ></div>
    </ng-template>
  </div>

  <div
    [ngClass]="
      routerOutletComponent == 'ProfilePageComponent' ||
      routerOutletComponent == 'ChatListPageComponent' ||
      routerOutletComponent == 'CartComponent' ||
      routerOutletComponent == 'CheckoutComponent' ||
      routerOutletComponent == 'HomePageComponent'
        ? 'contentProfile'
        : !isShopViewing && routerOutletComponent == 'ProductListPageComponent'
        ? 'content-with-map'
        : 'content-without-map'
    "
  >
    <router-outlet (activate)="fromRouterOutlet($event)"> </router-outlet>
  </div>
</div>

<app-sticky-footer
  *ngIf="
    routerOutletComponent == 'ProductListPageComponent' ||
    routerOutletComponent == 'HomePageComponent' ||
    routerOutletComponent == 'ChatListPageComponent' ||
    routerOutletComponent == 'ProfilePageComponent' ||
    routerOutletComponent == 'CartComponent'
  "
></app-sticky-footer>
