<section class="login-background" @fade>
  <ng-container *ngIf="currentDisplay == 'login-form'; else registerView">
    <div class="login-shell">
      <div class="login-hero">
        <img src="../../assets/images/logo/spoonwise-logo-full.png" alt="SpoonWise" class="login-logo" />

        <swiper [loop]="true" [autoHeight]="true" [allowTouchMove]="true" [pagination]="false" [navigation]="false"
          [autoplay]="{ delay: 4000, disableOnInteraction: false }" class="custom-swiper">
          <ng-template *ngFor="
              let src of [
                '../../assets/images/4.png',
                '../../assets/images/2.png',
                '../../assets/images/5.png',
                '../../assets/images/6.png',
                '../../assets/images/3.png',
                '../../assets/images/7.png',
                '../../assets/images/1.png',
              ];
              let i = index
            " data-swiper-autoplay="2000" swiperSlide>
            <img [src]="src" alt="" class="swiper-image" />
          </ng-template>
        </swiper>
      </div>

      <div class="container">
        <form [formGroup]="this.loginForm" class="login-form">
          <ng-container *ngIf="this.message !== ''">
            <p class="warning-message">
              {{ this.message }}
            </p>
          </ng-container>

          <div class="login-card-section d-flex flex-column gap-1">
            <div></div>
            <input placeholder="Username" type="text" formControlName="email" class="form-control" />
            <div>
              <input placeholder="Password" type="password" formControlName="password" class="form-control" />
            </div>

            <div>
              <button mat-flat-button class="btn-block fw-bold login-action-button" (click)="login()">
                LOG IN
              </button>
            </div>
          </div>

          <div class="login-card-section login-secondary-actions">
            <button mat-flat-button class="btn-block fw-bold login-action-button"
              (click)="updateCurrentDisplay('buyer-form')">
              SIGNUP
            </button>
            <button mat-flat-button class="btn-block fw-bold login-action-button"
              (click)="updateCurrentDisplay('seller-form')">
              SELL ON SPOONWISE
            </button>
          </div>

          <div class="login-version">V1.55.0</div>
        </form>
      </div>
    </div>
  </ng-container>

  <ng-template #registerView>
    <app-register [currentDisplay]="currentDisplay" (onBack)="back()"></app-register>
  </ng-template>
</section>

<ng-template #OTPSheet let-context>
  <ul class="sheet-list">
    <div style="justify-items: center; margin-bottom: 15px">
      <div style="
          margin-top: 8px;
          width: 40px;
          height: 5px;
          background-color: #f7d94f;
          border-radius: 20px;
        "></div>
    </div>

    <div style="margin: 7px">
      <div *ngIf="reviewSheetLoad">
        <div style="display: flex; align-items: center; justify-content: center">
          Loading...
        </div>
      </div>
    </div>
  </ul>
</ng-template>
