<ul class="sheet-list">
  <div style="display: flex; justify-content: center; margin-bottom: 15px">
    <div
      style="
        margin-top: 8px;
        width: 40px;
        height: 5px;
        background-color: #f7d94f;
        border-radius: 20px;
      "
    ></div>
  </div>

  <ng-container>
    <div
      #shopListContainer
      (scroll)="onScroll()"
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        height: calc(50dvh - 56.11px);
        overflow-y: scroll;
        padding: 0px 0px 7px 0px;
      "
    >
      <div *ngFor="let shop of nearestShops" class="card" style="width: 93%">
        <div
          style="
            display: flex;
            flex-direction: row;
            gap: 7px;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background-color: #f7d94f3b;
            border-radius: 30px;
            padding: 14px 14px;
          "
        >
          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: start;
              gap: 7px;
              flex: 2;
            "
          >
            <div style="display: flex; gap: 7px">
              <div>
                <img
                  [src]="shop.logo"
                  alt=""
                  width="40"
                  style="border-radius: 50%"
                />
              </div>

              <div>
                <h4>{{ shop.businessName }}</h4>
              </div>
            </div>

            <div
              style="
                display: flex;
                flex: 1;
                flex-direction: row;
                gap: 21px;
                width: 100%;
                justify-content: start;
              "
            >
              <div
                style="
                  display: flex;
                  flex-direction: column;

                  align-items: center;
                "
              >
                <div>Distance</div>
                <div>~{{ shop.distance }} km</div>
              </div>
              <div
                style="
                  display: flex;
                  flex-direction: column;

                  align-items: center;
                "
              >
                <div>Rating</div>
                <div>{{ shop.averageRating || "-" }}</div>
              </div>
              <div
                style="
                  display: flex;
                  flex-direction: column;

                  align-items: center;
                "
              >
                <div>Deals</div>
                <div>{{ shop.productCount || "-" }}</div>
              </div>
            </div>
          </div>
          <div style="display: flex; flex-direction: column">
            <div class="ms-icon-container" style="color: black">
              <button mat-icon-button (click)="viewShop(shop._id)">
                <mat-icon>store</mat-icon>
              </button>
            </div>

            <div class="ms-icon-container" style="color: black">
              <button mat-icon-button (click)="chatSeller(shop._id)">
                <mat-icon>chat_bubble</mat-icon>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</ul>
