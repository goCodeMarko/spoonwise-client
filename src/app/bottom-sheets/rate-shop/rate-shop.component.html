<ul class="sheet-list">
  <div style="display: flex; justify-content: center; margin-bottom: 15px">
    <div
      style="
        margin-top: 8px;
        width: 40px;
        height: 5px;
        background-color: #f7d94f;
        border-radius: 20px;
      "
    ></div>
  </div>

  <div style="margin: 0px 20px 20px 20px">
    <form
      [formGroup]="ratingForm"
      style="
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      "
    >
      <div>
        <ngx-star-rating
          formControlName="rating"
          [id]="'rating'"
        ></ngx-star-rating>
      </div>
      <div>
        <textarea
          matInput
          formControlName="comment"
          rows="5"
          maxlength="400"
          placeholder="Write your review or comments..."
          style="
            border: 3px solid #f9f9f9;
            border-radius: 15px;
            padding: 15px;
            resize: none;
            width: 80vw;
          "
        ></textarea>
      </div>
    </form>
  </div>

  <div
    style="
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 5vw;
    "
  >
    <div style="width: 550px">
      <button
        (click)="storeRate()"
        mat-flat-button
        color="main-green"
        class="btn-block fw-bold"
      >
        <ng-container *ngIf="!storeRateBtnOnLoad; else storeRateLoad">
          Rate
        </ng-container>
        <ng-template #storeRateLoad>
          <i class="fas fa-circle-notch fa-spin"></i>
        </ng-template>
      </button>
    </div>
  </div>
</ul>
