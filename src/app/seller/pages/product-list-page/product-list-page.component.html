<button
  style="
    position: absolute;
    z-index: 2;
    top: 323px;
    left: 7%;
    transform: translate(-50%, -50%);
    background: white;
    border-radius: 10px;
    color: #f8da50;
    padding: 4px;
    border: none;
    width: 38px;
  "
  (click)="toggleProductVisibility()"
>
  <i
    class="material-icons"
    [ngStyle]="{ color: productVisibility ? '#f8da50' : '#f6f6f6' }"
    >restaurant</i
  >
</button>
<app-product-list
  [visibility]="productVisibility"
  [showPublishSlider]="true"
  [isShop]="true"
  style="
    position: absolute;
    z-index: 2;
    top: 395px;
    left: 0;
    right: 0;
    margin-left: 7px;
    margin-right: 7px;
    width: auto;
  "
></app-product-list>
