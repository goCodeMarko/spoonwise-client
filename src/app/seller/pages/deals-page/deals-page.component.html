<div *ngIf="!isMapLoading; else loading">
  <app-map
    [height]="'calc(100dvh - 56.1px - 84px)'"
    [zIndex]="'1'"
    [borderRadius]="'0px'"
    [isShop]="true"
    [disabled]="true"
    [buyers]="buyers"
  ></app-map>
</div>
<ng-template #loading>
  <div
    class="loader"
    style="
      padding: 88px 7px 3px 7px;
      height: 100vh;
      z-index: 0;
      border-radius: 10px;
    "
  ></div>
</ng-template>
