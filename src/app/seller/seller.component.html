<div
  style="
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    overflow: hidden;
  "
>
  <app-sticky-header
    [routerOutletComponent]="routerOutletComponent"
    style="grid-column: 1/4; grid-row: 1"
  ></app-sticky-header>

  <div
    style="
      grid-column: 1/4;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background-color: red;
    "
  >
    <div *ngIf="routerOutletComponent == 'ProductListPageComponent'">
      <div *ngIf="!isMapLoading; else loading">
        <app-map [isShop]="true" [disabled]="true" [buyers]="buyers"></app-map>
      </div>
      <ng-template #loading>
        <div
          class="loader"
          style="
            padding: 88px 7px 3px 7px;
            height: 100vh;
            z-index: 0;
            border-radius: 10px;
          "
        ></div>
      </ng-template>
    </div>

    <div class="content">
      <router-outlet (activate)="fromRouterOutlet($event)"></router-outlet>
    </div>
  </div>

  <app-sticky-footer
    style="grid-row: 3; grid-column: 1/4"
    *ngIf="
      routerOutletComponent == 'ProductListPageComponent' ||
      routerOutletComponent == 'HomePageComponent' ||
      routerOutletComponent == 'ChatListPageComponent' ||
      routerOutletComponent == 'ProfilePageComponent' ||
      routerOutletComponent == 'AddProductComponent'
    "
    [showCart]="false"
    [isShop]="true"
  ></app-sticky-footer>
</div>
