<div style="
    display: flex;
    flex-direction: column;
    gap: 7px;
    overflow-y: scroll;
    height: calc(100vh - 56.1px);
    padding: 7px;
  ">
  <div style="
      display: flex;
      flex-direction: column;
      gap: 7px;
      background-color: #f6f6f6;
      border-radius: 7px;
      padding: 7px;
    ">

    <div
      style="display: flex;flex-direction: column;padding: 7px; align-items: start;gap:3px;  justify-content: space-between;gap: 3px;background-color: white; border-radius: 14px;">
      <div>
        <h3 style="font-size: 24px;
    line-height: 30px;">{{ blog.title }}</h3>
      </div>
      <div style="display: flex;align-items:start;justify-content:start;gap: 7px;">
        <div>{{ blog.createdAt | timeAgo }}</div>
        <div>

          <ng-container *ngIf="blog.audience === 'PUBLIC' else privateAudience">
            <mat-icon>public</mat-icon>
          </ng-container>
          <ng-template #privateAudience>
            <mat-icon>lock</mat-icon>
          </ng-template>
        </div>
      </div>
    </div>
    <div
      style="display: flex;flex-direction: column; align-items: center; background-color: white; padding:  7px; border-radius: 14px;">
      <div class="blog-content" [innerHTML]="blog.content"></div>
    </div>
  </div>
</div>
