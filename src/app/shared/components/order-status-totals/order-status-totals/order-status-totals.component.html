<ng-container *ngIf="onload; else dataLoaded"> Loading... </ng-container>
<ng-template #dataLoaded>
  <div style="display: flex; flex-direction: column; gap: 7px">
    <ng-container *ngIf="chartData.length; else emptyState">
    <div
      style="
        overflow-x: scroll;
        background-color: white;
        margin-top: 7px;
        border-radius: 8px;
      "
    >
      <!-- <div style="height: 30vh">
        <ngx-charts-line-chart
          [results]="x"
          [scheme]="colorScheme"
          [xAxis]="true"
          [yAxis]="true"
          [showXAxisLabel]="true"
          [showYAxisLabel]="true"
          [yScaleMax]="500"
          yAxisLabel="Sales"
          [autoScale]="true"
          [animations]="true"
          [timeline]="false"
          [roundDomains]="true"
        >
        </ngx-charts-line-chart>
      </div> -->
    </div>
    <div
      style="overflow-x: scroll; background-color: white; border-radius: 8px"
    >
      <div style="height: 30vh">
        <ngx-charts-bar-horizontal
          [results]="chartData"
          [scheme]="colorScheme"
          [xAxis]="true"
          [yAxis]="true"
          [legend]="false"
          [animations]="animationsEnabled"
          [showXAxisLabel]="false"
          [showYAxisLabel]="false"
          [showDataLabel]="true"
          [barPadding]="5"
          [gradient]="false"
        >
        </ngx-charts-bar-horizontal>
      </div>

      <div style="height: 60vh">
        <ngx-charts-pie-grid
          [results]="chartData"
          [scheme]="colorScheme"
          [legend]="false"
          [animations]="animationsEnabled"
          [tooltipDisabled]="false"
        >
        </ngx-charts-pie-grid>
      </div>
    </div>
    </ng-container>
    <ng-template #emptyState>
      <div
        style="
          background-color: white;
          border-radius: 8px;
          padding: 14px;
          margin-top: 7px;
        "
      >
        No dashboard data available yet.
      </div>
    </ng-template>
    <!-- <div
    style="
      display: grid;
      grid-template-columns: repeat(2, 1fr);

      margin-top: 7px;
    "
  >
    <div
      style="background-color: white; padding: 7px; border-radius: 8px"
      *ngFor="let data of data.data"
    >
      <div style="display: flex; flex-direction: column; gap: 7px">
        <div>
          {{ data.status | orderStatusPipe | uppercase }}
        </div>
        <div style="font-weight: 700; font-size: xx-large; color: #f8da50">
          {{ data.count }}
        </div>
      </div>
    </div>
  </div> -->
  </div>
</ng-template>
