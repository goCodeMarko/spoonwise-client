<h4 style="display: block; text-align: center">Top 10 Nearest Shops</h4>
<div
  #shopListContainer
  (scroll)="onScroll()"
  style="
    display: flex;
    flex-direction: column;
    gap: 7px;
    overflow-x: scroll;
    height: 28vh;
  "
>
  <div
    *ngFor="let shop of nearestShops"
    style="
      display: flex;
      align-items: start;
      flex-direction: column;
      gap: 7px;
      justify-content: space-between;
      background-color: white;
      border-radius: 7px;
      padding: 7px;
      min-width: 300px;
    "
  >
    <div
      style="
        display: flex;
        flex-direction: row;
        gap: 7px;
        align-items: center;
        width: 100%;
      "
    >
      <div style="display: flex; flex-direction: column; gap: 7px; flex: 2">
        <div style="display: flex; gap: 7px">
          <div>
            <img
              [src]="'assets/images/logo/spoonwise-icon.png'"
              alt=""
              width="40"
              style="border-radius: 50%"
            />
          </div>

          <div>
            <h4>{{ shop.businessName }}</h4>
          </div>
        </div>

        <div
          style="
            display: flex;
            flex: 1;
            flex-direction: row;
            gap: 7px;
            width: 100%;
            justify-content: space-evenly;
          "
        >
          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 7px;
              align-items: center;
            "
          >
            <div>Distance</div>
            <div>~{{ shop.distance }} km</div>
          </div>
          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 7px;
              align-items: center;
            "
          >
            <div>Rating</div>
            <div>{{ shop.averageRating || "-" }}</div>
          </div>
          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 7px;
              align-items: center;
            "
          >
            <div>Deals</div>
            <div>{{ shop.productCount || "-" }}</div>
          </div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 7px">
        <a [routerLink]="['/deals']" [queryParams]="{ shop: shop._id }"
          ><button mat-stroked-button style="width: 100%">Visit Shop</button></a
        >

        <button
          (click)="chatSeller(shop._id)"
          mat-stroked-button
          style="width: 100%"
        >
          Chat Seller
        </button>
      </div>
    </div>
  </div>
</div>
